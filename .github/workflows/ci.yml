name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: followup
          POSTGRES_PASSWORD: followup
          POSTGRES_DB: followup
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U followup -d followup"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FOLLOWUP_DB: "Host=localhost;Port=5432;Database=followup;Username=followup;Password=followup"
      FOLLOWUP_AUTH_SECRET: "ci-signing-secret-not-for-production-0123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FollowUp.sln
      # Build enforces warnings-as-errors + the architecture tests gate dependency direction.
      - name: Build
        run: dotnet build FollowUp.sln -c Release --no-restore

      - name: Apply migrations
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.29
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project src/FollowUp.Infrastructure \
            --startup-project src/FollowUp.Infrastructure

      - name: Test (domain, application, integration, architecture)
        run: dotnet test FollowUp.sln -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
