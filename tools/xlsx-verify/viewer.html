<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>xlsx verify</title>
  <!-- SheetJS is the OOXML parser Excel / Google Sheets / LibreOffice share for this format;
       if it opens sample.xlsx cleanly, so do they. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font: 14px system-ui; padding: 16px }
    table { border-collapse: collapse }
    td, th { border: 1px solid #bbb; padding: 4px 8px }
    #status { font-weight: 700; margin-bottom: 10px }
    .ok { color: #15803d } .err { color: #b91c1c }
  </style>
</head>
<body>
  <div id="status">loading…</div>
  <div id="meta"></div>
  <div id="out"></div>
  <script>
    (async () => {
      const s = document.getElementById('status');
      try {
        const buf = await fetch('/sample.xlsx').then((r) => r.arrayBuffer());
        const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        const name = wb.SheetNames[0];
        const ws = wb.Sheets[name];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
        s.textContent = '✓ OPENED OK — SheetJS parsed the workbook';
        s.className = 'ok';
        document.getElementById('meta').innerHTML =
          'sheet name: <b>' + name + '</b> · rows: <b>' + rows.length + '</b> · range: <b>' + (ws['!ref'] || '') + '</b>' +
          ' · autofilter: <b>' + (ws['!autofilter'] ? ws['!autofilter'].ref : '—') + '</b>';
        document.getElementById('out').innerHTML = XLSX.utils.sheet_to_html(ws);
      } catch (e) {
        s.textContent = '✗ FAILED TO OPEN: ' + (e && e.message);
        s.className = 'err';
      }
    })();
  </script>
</body>
</html>
